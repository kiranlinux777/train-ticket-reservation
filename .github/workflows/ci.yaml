name: CI/CD Pipeline with SonarQube

on:
  push:
    branches:
      - master

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout Source Code
      - name: Checkout Source
        uses: actions/checkout@v4


      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      # 3. Validate
      - name: Validate
        run: mvn validate


      # 4. Compile
      - name: Compile
        run: mvn compile


      # 5. Test
      - name: Test
        run: mvn test


      # 6. Package
      - name: Package
        run: mvn package
      - name: Test SonarQube
        run: |
         echo "Testing SonarQube connection..."
         curl -v "${{ secrets.SONAR_HOST_URL }}/api/system/status"


      # 7. SonarQube Scan
      - name: SonarQube Scan
        run: |
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar \
          -Dsonar.host.url="${{ secrets.SONAR_HOST_URL }}" \
          -Dsonar.token="${{ secrets.SONAR_TOKEN }}"
